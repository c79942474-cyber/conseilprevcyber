<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Connexion — CONSEILPREV Cyber</title>
<meta name="description" content="Connexion à l'espace client CONSEILPREV Cyber (cockpit de supervision OT).">
<link rel="icon" href="/emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<style>
  .authwrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .authcard{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:16px;padding:32px}
  .authcard h1{font-size:24px;margin-bottom:6px}
  .authcard .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  .msg{border-radius:9px;padding:11px 14px;font-size:13.5px;margin-bottom:16px;display:none}
  .msg.err{background:rgba(217,96,58,.12);border:1px solid rgba(217,96,58,.3);color:var(--danger);display:block}
  .msg.ok{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.3);color:var(--green);display:block}
  .authcard .btn-p{width:100%;text-align:center;margin-top:6px}
  .authlinks{margin-top:20px;display:flex;justify-content:space-between;font-size:13px}
  .authlinks a{color:var(--cyan)}
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand"><a href="/" class="brand-link"><img src="/emblem.svg" class="brand-mark" width="30" height="30" alt="">CONSEILPREV</a><span class="tag">Cyber</span></div>
      <div class="spacer"></div>
      <nav class="links"><a href="/">← Accueil</a><a href="/demo">Démo</a>
<a href="/about">À propos</a>
<a href="/vos-projets" class="cta-alt">Vos projets</a></nav>
    </div>
  </header>

  <main class="authwrap">
    <div class="authcard">
      <h1>Connexion</h1>
      <p class="sub">Accédez à votre cockpit de supervision OT.</p>
      <div id="msg" class="msg"></div>
      <form id="f" class="form" style="max-width:none;background:none;border:none;padding:0">
        <div class="field"><label for="email">Email <button type="button" class="tipi" data-tip="L'adresse de votre compte (email professionnel utilisé à l'inscription)." aria-label="Aide : quel email utiliser. L'adresse de votre compte (email professionnel utilisé à l'inscription).">i</button></label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Mot de passe <button type="button" class="tipi" data-tip="Connexion chiffrée. Après plusieurs essais infructueux, l'accès est temporairement bloqué." aria-label="Aide : sécurité du mot de passe. Connexion chiffrée. Après plusieurs essais infructueux, l'accès est temporairement bloqué.">i</button></label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-p" type="submit">Se connecter</button>
        <div class="secnote"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Connexion chiffrée · protection anti-bruteforce · session sécurisée.</div>
      </form>
      <div class="authlinks">
        <a href="/mot-de-passe-oublie">Mot de passe oublié&nbsp;?</a>
        <a href="/inscription">Créer un compte</a>
      </div>
    </div>
  </main>

  <script>
  (function(){
    var q=new URLSearchParams(location.search), msg=document.getElementById('msg');
    function show(t,cls){msg.textContent=t;msg.className='msg '+cls;}
    if(q.get('verifie'))show('Email confirmé. Votre accès sera actif après validation par notre équipe (vous recevrez un email).','ok');
    if(q.get('deconnecte'))show('Vous êtes déconnecté.','ok');
    /* ANTI-OPEN-REDIRECT. Un seul « / » en tête, jamais deux : sans ce
       contrôle, next=https://evil.example/... ou next=//evil.example/...
       renvoyait, après une connexion RÉUSSIE sur ce vrai domaine, vers une
       copie qui redemande le mot de passe — le même contrôle que le serveur
       applique côté redirection déjà connectée. */
    var nextRaw=q.get('next');
    var nextUrl=(nextRaw && nextRaw.charAt(0)==='/' && nextRaw.charAt(1)!=='/'
                && nextRaw.charAt(1)!=='\\') ? nextRaw : '/demo';
    var bouton=document.querySelector('#f button[type=submit]');
    var enCours=false;
    document.getElementById('f').addEventListener('submit',function(e){
      e.preventDefault();
      /* UN SEUL ESSAI À LA FOIS. Le bouton restait actif pendant la requête :
         sur un serveur lent à se réveiller, un deuxième clic partait — et
         CHAQUE tentative compte au compteur anti-bruteforce. On se retrouvait
         bloqué pour « trop de tentatives » en croyant n'avoir essayé qu'une
         fois, ce qui donne exactement l'impression d'une connexion cassée. */
      if(enCours) return;
      enCours=true;
      bouton.disabled=true;
      var libelle=bouton.textContent;
      bouton.textContent='Connexion…';
      show('Connexion…','ok');
      function fini(){ enCours=false; bouton.disabled=false; bouton.textContent=libelle; }
      fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})})
        /* UNE RÉPONSE QUI N'EST PAS DU JSON EST UNE RÉPONSE QUAND MÊME. `r.json()`
           lève sur une page d'erreur HTML — celle que renvoie l'hébergeur quand
           l'application redémarre ou dépasse son délai. L'exception tombait
           dans le `catch` réseau, et le visiteur lisait « erreur réseau » alors
           que sa connexion allait très bien : le serveur avait répondu, mal.
           On distingue donc les deux, et on donne le code : « HTTP 502 » se
           cherche et se comprend, « erreur réseau » envoie corriger le Wi-Fi. */
        .then(function(r){
          return r.text().then(function(t){
            try { return {s:r.status, j:JSON.parse(t)}; }
            catch(x){ return {s:r.status, j:null}; }
          });
        })
        // « message » d'abord : sur une erreur générique du serveur, « error » ne
        // contient qu'un CODE (« erreur_serveur ») — illisible pour qui se
        // connecte, et qui laisse croire à un identifiant refusé.
        .then(function(o){
          if(o.j && o.j.ok){ location.href=nextUrl; return; }
          fini();
          if(o.j){ show(o.j.message||o.j.error||'Échec de la connexion.','err'); return; }
          show('Le serveur a répondu une erreur (HTTP '+o.s+'), pas un refus de '
             + 'vos identifiants. Réessayez dans un instant — le service peut '
             + 'être en cours de redémarrage.','err');
        })
        .catch(function(){
          fini();
          show('Le serveur n’a pas répondu. Vérifiez votre connexion, puis réessayez.','err');
        });
    });
  })();
  </script>
  <script src="/nav.js" defer></script>
  <script src="/parcours.js" defer></script>
</body>
</html>
