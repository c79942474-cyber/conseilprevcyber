services:
  - type: web
    name: conseilprevcyber
    region: frankfurt
    env: python
    buildCommand: pip install -r requirements.txt
    # Le réglage vit dans gunicorn.conf.py, pas sur cette ligne : la capacité
    # se règle alors par variables d'environnement (WEB_WORKERS, WEB_THREADS…),
    # sans toucher au code ni redéployer une ligne de commande. Worker à
    # threads (gthread) : requis pour le flux SSE du cockpit (/api/stream), qui
    # maintient des connexions longues.
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    # (Optionnel) Disque persistant — persistance de la base de connaissance RAG
    # sans PostgreSQL. Décommentez, ajustez la taille, puis définissez la variable
    # RAG_DISK_PATH = /var/data/rag.json (voir plus bas). Alternative économique à
    # PostgreSQL pour une instance unique.
    # disk:
    #   name: rag-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Clé API Brevo (transactional email) — à renseigner dans le dashboard Render.
      # Sans elle, le formulaire de contact bascule sur un lien mailto.
      - key: BREVO_API_KEY
        sync: false
      # Jeton du flux temps réel du cockpit (protège POST /api/ingest).
      # Sans lui, l'ingestion est fermée et le cockpit reste en mode démo.
      - key: INGEST_TOKEN
        sync: false
      # Persistance (cockpit, base de connaissance RAG, historique des livrables,
      # comptes, clients).
      #
      # À COLLER À LA MAIN : « Internal Database URL » de la base PostgreSQL, prise
      # sur SA page dans le tableau de bord Render.
      #
      # Pourquoi pas « fromDatabase » ? Ce raccourci désigne la base par son NOM.
      # Si ce nom ne correspond à AUCUNE base existante, Render injecte malgré tout
      # une URL — qui pointe vers une base fantôme. La panne obtenue est
      # particulièrement trompeuse : le nom se résout (le DNS répond) mais rien
      # n'accepte la connexion (délai TCP), pendant que la vraie base, elle, est
      # « Available » et inutilisée. C'est exactement ce qui s'est produit ici, le
      # blueprint déclarant « conseilprevcyber-db » alors que la base réelle
      # s'appelle « conseilprevcyberDB ». En saisissant la valeur à la main, elle
      # ne peut plus être réécrite silencieusement par une synchronisation.
      - key: DATABASE_URL
        sync: false
      # (Optionnel) Persistance de la base de connaissance RAG SANS PostgreSQL :
      # pointer RAG_DISK_PATH vers un emplacement DURABLE (disque Render monté —
      # voir la section « disk » commentée plus bas — ou volume auto-hébergé).
      # La base y est sauvegardée et rechargée au démarrage. ATTENTION : sans
      # disque monté, le chemin est ÉPHÉMÈRE (effacé à chaque redéploiement) ;
      # pour une vraie persistance, préférez DATABASE_URL (PostgreSQL) ci-dessus.
      - key: RAG_DISK_PATH
        sync: false
      # Haute disponibilité multi-instance (optionnel). Si défini, les événements
      # sont diffusés via Redis pub/sub à toutes les instances (fan-out SSE partagé).
      # Requiert aussi DATABASE_URL (état partagé). Sinon : une seule instance.
      - key: REDIS_URL
        sync: false
      # Rétention de l'historique (optionnel, nécessite DATABASE_URL). Purge auto
      # des événements au-delà de N jours et/ou au-delà de N lignes.
      - key: EVENT_RETENTION_DAYS
        sync: false
      - key: EVENT_MAX_ROWS
        sync: false
      # Comptes (inscription + validation admin + connexion) — voir auth.py.
      # Clé de signature des sessions : générée automatiquement par Render.
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Email qui reçoit les demandes d'accès à approuver (= compte admin).
      - key: ADMIN_EMAIL
        sync: false
      # Mot de passe initial du compte admin (créé au premier démarrage s'il
      # n'existe pas ; modifiable ensuite via « mot de passe oublié »).
      - key: ADMIN_PASSWORD
        sync: false
      # URL publique (liens des emails de confirmation / réinitialisation).
      - key: PUBLIC_BASE_URL
        sync: false
      # Assistant IA conversationnel (/assistant). Chaque clé active son modèle ;
      # sans clé, le modèle est signalé « non configuré » (l'app fonctionne quand même).
      #
      # ATTENTION : ANTHROPIC_API_KEY commande BEAUCOUP PLUS que le chat. C'est
      # le fournisseur retenu par défaut partout où le code n'en choisit pas —
      # rédaction des pièces de dossier, résumés de veille, rapport
      # hebdomadaire, qualification des demandes entrantes. Sans elle, chacun de
      # ces travaux retombe sur son repli (assemblage, ou rien) SANS ERREUR
      # VISIBLE : le site fonctionne, il rend simplement moins.
      # Claude (Anthropic) — https://console.anthropic.com/
      - key: ANTHROPIC_API_KEY
        sync: false
      # Mistral (fournisseur européen) — https://console.mistral.ai/
      - key: MISTRAL_API_KEY
        sync: false
      # (Optionnel) surcharge des modèles utilisés. C'est ICI qu'on change de
      # génération de modèle, sans toucher au code : la valeur par défaut est
      # figée dans assistant.py et vieillit, cette variable non. Les appels
      # demandent explicitement une réponse directe, sans raisonnement
      # préalable, de sorte que les budgets de jetons tiennent quel que soit le
      # modèle retenu — c'est ce qui rend ce changement sûr à faire seul.
      - key: ANTHROPIC_MODEL
        sync: false
      - key: MISTRAL_MODEL
        sync: false
      # ── Disponibilité ────────────────────────────────────────────────────
      # Capacité du serveur. Valeurs par défaut : 2 processus × 16 fils.
      # Ramener WEB_WORKERS à 1 si l'instance manque de mémoire.
      - key: WEB_WORKERS
        sync: false
      - key: WEB_THREADS
        sync: false
      # Rédaction des pièces d'ingénierie datacenter (page
      # /ingenierie-datacenter). Non défini => « documentaire » : AUCUN modèle
      # d'IA n'est appelé — le moteur compose le cadre exigentiel, et le texte
      # vient des documents chargés dans la base de connaissance, cherchés
      # d'abord dans les sous-dossiers du thème correspondant à la pièce.
      # « modele » rebranche la rédaction assistée par IA sur cette page.
      # La console d'administration et le chat ne dépendent pas de ce réglage.
      - key: INGENIERIE_REDACTION
        sync: false
      # Appels SIMULTANÉS au modèle, toutes pages confondues (défaut : 3).
      # Bien en dessous du nombre de fils : c'est ce qui garantit qu'il en
      # reste toujours pour SERVIR LES PAGES quand le service d'IA est lent.
      # Au-delà, la rédaction se replie sur l'assemblage plutôt que d'attendre.
      - key: LLM_MAX_SIMULTANE
        sync: false
      # Fournisseur mis en avant : « claude » ou « mistral ».
      # Non défini => « claude ». L'utilisateur peut toujours basculer
      # manuellement vers l'autre modèle dans l'interface, et les travaux de
      # fond prennent celui qui a une clé si le préféré n'en a pas.
      #
      # Ce réglage a une portée RGPD : Mistral est un fournisseur européen,
      # Anthropic ne l'est pas. Ce qui borne l'exposition ici, c'est que RIEN
      # n'est conservé côté serveur — aucune conversation n'est stockée, et
      # aucune entrée n'alimente d'entraînement (voir assistant.py). Basculer
      # ce réglage sur « mistral » ramène le traitement dans l'UE.
      - key: ASSISTANT_DEFAULT_MODEL
        sync: false
      # ── Paiement : ouvrir un accès en réglant en ligne ───────────────────
      # LES TROIS ENSEMBLE, OU RIEN. `paiement.configure()` les exige toutes :
      # une clé sans identifiant de prix ouvrirait un bouton qui mène à une
      # erreur, et un bouton qui échoue vaut moins qu'un bouton absent. Tant
      # qu'il en manque une, le bloc de paiement de /connexion reste caché,
      # /api/paiement/etat répond « configure: false », et TOUT compte attend
      # la validation manuelle. Le piège n'est pas zéro sur trois, c'est deux
      # sur trois : rien ne s'allume et rien ne prévient. Le panneau « État des
      # réglages » de /admin nomme désormais celles qui manquent.
      #
      # MÊME COMPTE STRIPE QUE SENTINEL, identifiant de PRIX distinct : une
      # facturation, un tableau de bord, une TVA — deux catalogues. C'est cela,
      # « caisses séparées ».
      #
      # Commencer en mode TEST : clé sk_test_… et carte 4242 4242 4242 4242.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Secret de signature de l'endpoint webhook (whsec_…), pris sur la page
      # de CE webhook dans le tableau de bord Stripe — pas sur la page des
      # clés d'API. Sans lui, aucune notification n'est acceptée : les
      # paiements passeraient et aucun accès ne s'ouvrirait.
      # Événement à écouter : checkout.session.completed
      # Adresse à déclarer : https://<votre-domaine>/api/stripe/webhook
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Identifiant du prix (price_…) de l'article « ouverture d'accès ».
      # Pris sur la fiche du PRODUIT, pas sur celle du produit lui-même.
      - key: STRIPE_PRICE_ACCES
        sync: false

# Base PostgreSQL — persistance de TOUT l'état applicatif : cockpit, base de
# connaissance (documents + fragments indexés), livrables, comptes, clients.
#
# ELLE N'EST VOLONTAIREMENT PAS DÉCLARÉE ICI. La base en service a été créée
# directement dans le tableau de bord Render :
#
#     nom       conseilprevcyberDB       région    Frankfurt (EU Central)
#     plan      Basic-1gb                stockage  15 Go
#     version   PostgreSQL 18 (pgvector) accès     réseau privé
#
# La redéclarer sous un autre nom ferait provisionner une SECONDE base par le
# blueprint, et DATABASE_URL pointerait vers elle — c'est précisément l'incident
# survenu : le blueprint déclarait « conseilprevcyber-db » quand la base réelle
# s'appelle « conseilprevcyberDB ». Résultat, une URL vers une base fantôme, dont
# le nom se résolvait sans que rien n'accepte la connexion, tandis que la vraie
# base restait « Available » et inutilisée. Diagnostic correspondant, visible via
# « 🩺 Tester le chargement » : dns ✓ puis « tcp — timed out ».
#
# DATABASE_URL est donc saisi à la main (voir le service, sync: false) et reste
# la seule source de vérité. Pour repartir d'une base neuve ou en changer :
# voir MIGRATION-BASE.md.
#
# Dimensionnement : ~4 Ko d'embedding par fragment (~1,3 Mo pour un document de
# 333 fragments), plus le fichier d'origine s'il est conservé en base. Le panneau
# « 📊 Espace disque » de l'admin suit l'occupation et libère le superflu.
